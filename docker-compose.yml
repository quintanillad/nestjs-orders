services:
  api:
    build: .
    container_name: api-orders
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      - DB_NAME=orders_db
      - DB_POOL_MAX=20
    ports:
      - "5001:5001"

  db:
    image: postgres:16
    container_name: db-orders
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      - POSTGRES_DB=orders_db
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  dbdata:
